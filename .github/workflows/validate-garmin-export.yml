name: Validate Garmin exporter

on:
  push:
    branches: [release/garmin-production-clean]
  pull_request:
    branches: [main]
    paths:
      - "src/garmin_export.py"
      - "src/motherduck_loader.py"
      - "src/motherduck_export.py"
      - "sql/garmin_motherduck_model.sql"
      - "checks/**"
      - ".github/workflows/validate-garmin-export.yml"
      - ".github/workflows/garmin-motherduck.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade garmin-connect-personal-api-python duckdb==1.5.6 dropbox
      - name: Validate Python syntax
        run: python -m py_compile src/garmin_export.py src/motherduck_loader.py src/motherduck_export.py
      - name: Run exporter quality checks
        run: python -m unittest discover -s checks -p '*_checks.py' -v
