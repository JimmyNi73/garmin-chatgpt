name: Garmin to MotherDuck | Run & Maintain

on:
  push:
    branches:
      - feature/run-maintain
    paths:
      - "src/motherduck_maintain.py"
      - "src/motherduck_loader.py"
      - ".github/workflows/garmin-motherduck-maintain.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Keep enabled for validation; disable only after explicit approval"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: garmin-motherduck-run-maintain
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade garmin-connect-personal-api-python duckdb==1.5.6

      - name: Validate Python syntax
        run: python -m py_compile src/garmin_export.py src/motherduck_loader.py src/motherduck_export.py src/motherduck_maintain.py

      - name: Run quality checks
        run: python -m unittest discover -s checks -p '*_checks.py' -v

      - name: Run 30-day Run & Maintain
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          GARMIN_HISTORY_MODE: incremental
          GARMIN_MOTHERDUCK_DRY_RUN: ${{ github.event_name == 'push' && 'false' || inputs.dry_run }}
          GARMIN_REQUEST_PAUSE_SECONDS: "0.3"
          GARMIN_BATCH_PAUSE_SECONDS: "5"
          GARMIN_MAX_RETRIES: "8"
        run: python src/motherduck_maintain.py
