name: Validate Garmin Run & Maintain

on:
  push:
    branches:
      - feature/run-maintain
    paths:
      - "src/**"
      - "checks/**"
      - ".github/workflows/validate-run-maintain.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "checks/**"
      - ".github/workflows/validate-run-maintain.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade duckdb==1.5.6 garmin-connect-personal-api-python
      - name: Validate Python syntax
        run: python -m py_compile src/garmin_export.py src/motherduck_loader.py src/motherduck_export.py src/motherduck_maintain.py src/motherduck_sample_test.py
      - name: Run unit tests
        run: python -m unittest discover -s checks -p '*_checks.py' -v
      - name: Run bounded Garmin sample load and deep validation
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[run-sample-garmin]') }}
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: garmin_github
          GARMIN_REQUEST_PAUSE_SECONDS: "0.3"
          GARMIN_BATCH_PAUSE_SECONDS: "5"
          GARMIN_MAX_RETRIES: "8"
          MOTHERDUCK_BATCH_SIZE: "100"
        run: python src/motherduck_sample_test.py
