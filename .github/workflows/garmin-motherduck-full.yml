name: Garmin to MotherDuck | Full History
# Full rebuild sourced directly from Garmin Personal API. Dropbox is not used.

on:
  workflow_dispatch:
  schedule:
    # Daily at 05:00 UTC (06:00 Stockholm in winter, 07:00 in summer).
    - cron: "0 5 * * *"
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: garmin-motherduck-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade garmin-connect-personal-api-python duckdb==1.5.6

      - name: Validate Python syntax
        run: python -m py_compile src/garmin_export.py src/motherduck_loader.py src/motherduck_export.py

      - name: Validate ingestion logic
        run: python -m unittest discover -s checks -p '*_checks.py' -v

  ingest:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || contains(github.event.head_commit.message, '[run-garmin-full]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade garmin-connect-personal-api-python duckdb==1.5.6

      - name: Load complete Garmin history into MotherDuck
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: garmin_github
          MOTHERDUCK_BATCH_SIZE: "100"
          GARMIN_HISTORY_MODE: "rolling"
          GARMIN_REQUEST_PAUSE_SECONDS: "0.3"
          GARMIN_BATCH_PAUSE_SECONDS: "5"
          GARMIN_MAX_RETRIES: "8"
        run: |
          for attempt in 1 2 3; do
            echo "Full-history ingestion attempt $attempt of 3"
            if python src/motherduck_export.py; then
              echo "Garmin full-history ingestion completed successfully"
              exit 0
            else
              exit_code=$?
              echo "Attempt $attempt failed with exit code $exit_code"
              if [ "$attempt" -lt 3 ]; then
                echo "Waiting 60 seconds before retrying; durable checkpoints will be reused"
                sleep 60
              fi
            fi
          done
          echo "Garmin full-history ingestion failed after 3 attempts"
          exit 1
