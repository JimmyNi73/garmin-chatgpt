name: Garmin Data Export

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Paired slots plus a local Europe/Stockholm guard
    # keep runs at 08:00, 14:00 and 20:00 in both CET and CEST.
    - cron: "0 6,7,12,13,18,19 * * *"

permissions:
  contents: read

concurrency:
  group: garmin-data-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Garmin client
        run: python -m pip install --upgrade garmin-connect-personal-api-python dropbox

      - name: Export Garmin data
        env:
          GARMIN_PERSONAL_API_KEY: \${{ secrets.GARMIN_PERSONAL_API_KEY }}
          DROPBOX_APP_KEY: \${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: \${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: \${{ secrets.DROPBOX_REFRESH_TOKEN }}
          GARMIN_REQUEST_PAUSE_SECONDS: "1"
          GARMIN_BATCH_PAUSE_SECONDS: "20"
          GARMIN_MAX_RETRIES: "8"
          GARMIN_CURRENT_ACTIVITY_DAYS: "30"
          GARMIN_RANGE_DAYS: "30"
          GARMIN_DAILY_DETAIL_DAYS: "14"
        run: python src/garmin_export.py
