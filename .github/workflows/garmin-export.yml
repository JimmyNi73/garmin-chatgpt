name: Garmin Data Export

on:
  workflow_dispatch:
  issues:
    types: [opened]
  schedule:
    # Paired UTC slots plus the Europe/Stockholm guard handle CET and CEST.
    - cron: "0 4,5,6,7,12,13,14,15,18,19 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: garmin-data-export
  cancel-in-progress: false

jobs:
  export:
    if: ${{ github.event_name != 'issues' || (github.event.action == 'opened' && github.event.issue.title == 'Starta Garmin-export') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Garmin client
        run: python -m pip install --upgrade garmin-connect-personal-api-python dropbox

      - name: Export Garmin data
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          GARMIN_REQUEST_PAUSE_SECONDS: "1"
          GARMIN_BATCH_PAUSE_SECONDS: "20"
          GARMIN_MAX_RETRIES: "8"
          GARMIN_CURRENT_ACTIVITY_DAYS: "30"
          GARMIN_RANGE_DAYS: "30"
          GARMIN_DAILY_DETAIL_DAYS: "14"
        run: python src/garmin_export.py

      - name: Close start request
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            gh issue close "$ISSUE_NUMBER" --comment "Garmin-exporten är klar."
          else
            gh issue close "$ISSUE_NUMBER" --comment "Garmin-exporten misslyckades. Kontrollera körningsloggen i GitHub Actions."
          fi
