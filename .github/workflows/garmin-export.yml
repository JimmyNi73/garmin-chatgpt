name: Garmin Data Export

on:
  workflow_dispatch:
  issues:
    types: [opened]
  schedule:
    # Temporary test at 16:40 Stockholm time; remove after verification.
    - cron: "40 16 * * *"
      timezone: "Europe/Stockholm"
    # Regular schedule: 06:07, 08:07, 14:07, 20:07 and 22:07 Stockholm time.
    - cron: "7 6,8,14,20,22 * * *"
      timezone: "Europe/Stockholm"

permissions:
  contents: read

concurrency:
  group: garmin-data-export
  cancel-in-progress: false

jobs:
  export:
    if: github.event_name != 'issues' || github.event.issue.title == 'Starta Garmin-export'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Garmin client
        run: python -m pip install --upgrade garmin-connect-personal-api-python dropbox

      - name: Validate Python syntax
        run: python -m py_compile src/garmin_export.py

      - name: Run exporter unit tests
        run: python -m unittest discover -s tests -v

      - name: Export Garmin data
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          GARMIN_REQUEST_PAUSE_SECONDS: "0.3"
          GARMIN_BATCH_PAUSE_SECONDS: "5"
          GARMIN_MAX_RETRIES: "8"
          GARMIN_GEAR_BACKFILL_ONLY: "false"
        run: python src/garmin_export.py
