name: Garmin MotherDuck Test

on:
  push:
    branches:
      - feature/motherduck-service-db
    paths:
      - "src/motherduck_loader.py"
      - "src/motherduck_export.py"
      - "src/motherduck_backfill.py"
      - "sql/garmin_motherduck_model.sql"
      - "tests/**"
      - ".github/workflows/motherduck-pilot.yml"
  workflow_dispatch:
    inputs:
      confirm_test:
        description: "Type RUN to confirm the record-level Garmin test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: garmin-motherduck-service-db-test
  cancel-in-progress: true

jobs:
  ingest:
    if: ${{ github.event_name == 'push' || inputs.confirm_test == 'RUN' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade garmin-connect-personal-api-python dropbox duckdb

      - name: Validate Python syntax
        run: python -m py_compile src/garmin_export.py src/motherduck_loader.py src/motherduck_export.py src/motherduck_backfill.py

      - name: Run exporter unit tests
        run: python -m unittest discover -s tests -v

      - name: Backfill complete Dropbox history into relational CORE
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: garmin_github
        run: python src/motherduck_backfill.py

      - name: Cross-check selected historical periods and refresh recent Garmin data
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: garmin_github
          GARMIN_REQUEST_PAUSE_SECONDS: "0.3"
          GARMIN_BATCH_PAUSE_SECONDS: "5"
          GARMIN_MAX_RETRIES: "8"
        run: python src/motherduck_export.py
