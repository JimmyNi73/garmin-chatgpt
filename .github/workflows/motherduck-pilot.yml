name: Garmin MotherDuck Pilot

on:
  push:
    branches:
      - feature/motherduck-ingestion
  workflow_dispatch:
    inputs:
      days:
        description: "Number of recent calendar days to load"
        required: true
        default: "14"
        type: choice
        options:
          - "7"
          - "14"
          - "30"

permissions:
  contents: read

concurrency:
  group: garmin-motherduck-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/motherduck-ingestion

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade duckdb dropbox garmin-connect-personal-api-python

      - name: Validate code and tests
        run: |
          python -m py_compile src/garmin_export.py src/motherduck_loader.py src/motherduck_pilot.py
          python -m unittest discover -s tests -p 'test_motherduck_loader.py' -v

      - name: Run 14-day Garmin to MotherDuck pilot
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: garmin
          PILOT_DAYS: ${{ inputs.days || '14' }}
          GARMIN_REQUEST_PAUSE_SECONDS: "0.3"
          GARMIN_BATCH_PAUSE_SECONDS: "5"
          GARMIN_MAX_RETRIES: "5"
        run: |
          PYTHONPATH=src python src/motherduck_pilot.py
