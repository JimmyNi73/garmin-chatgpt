name: Garmin MotherDuck Test

on:
  # Deliberately manual only. A push must never start an ingestion job.
  workflow_dispatch:
    inputs:
      confirm_test:
        description: "Type RUN to confirm the controlled MotherDuck test"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: garmin-motherduck-service-db-test
  cancel-in-progress: false

jobs:
  guard:
    if: ${{ inputs.confirm_test == 'RUN' }}
    runs-on: ubuntu-latest
    steps:
      - name: Block until the new record-level exporter is implemented
        run: |
          echo "The legacy pilot is disabled. The new two-month + recent-14-day exporter is not yet implemented."
          exit 1
