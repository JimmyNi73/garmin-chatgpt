name: Garmin MotherDuck Pilot

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Number of recent calendar days to load"
        required: true
        default: "14"
        type: choice
        options:
          - "7"
          - "14"
          - "30"

permissions:
  contents: read

concurrency:
  group: garmin-motherduck-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/motherduck-ingestion

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade duckdb

      - name: Validate code and tests
        run: |
          python -m py_compile src/motherduck_loader.py
          python -m unittest tests.test_motherduck_loader -v

      - name: Validate MotherDuck connection
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: my_db
          PILOT_DAYS: ${{ inputs.days }}
        run: |
          python - <<'PY'
          import os, duckdb
          if not os.getenv("MOTHERDUCK_TOKEN"):
              raise SystemExit("Missing GitHub secret MOTHERDUCK_TOKEN")
          con = duckdb.connect("md:" + os.getenv("MOTHERDUCK_DATABASE", "my_db"))
          print("MotherDuck connection OK")
          con.close()
          PY
