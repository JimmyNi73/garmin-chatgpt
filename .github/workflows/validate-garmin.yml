name: Validate Garmin export changes

on:
  push:
    branches:
      - garmin-complete-history-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install garmin-connect-personal-api-python dropbox
      - name: Compile export script
        run: python -m py_compile src/garmin_export.py
      - name: Run helper tests
        run: python -m unittest discover -s tests -v
