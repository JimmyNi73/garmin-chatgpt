name: Garmin to MotherDuck | Bounded Test

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_run:
        description: "Type TEST to confirm truncate + three-window test load"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: garmin-motherduck-production
  cancel-in-progress: true

jobs:
  ingest:
    if: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-garmin-test]')) || inputs.confirm_run == 'TEST' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade garmin-connect-personal-api-python duckdb==1.5.6 dropbox

      - name: Validate Python syntax
        run: python -m py_compile src/garmin_export.py src/motherduck_loader.py src/motherduck_export.py

      - name: Validate ingestion logic
        run: python -m unittest discover -s checks -p '*_checks.py' -v

      - name: Download the reference Garmin ZIP from Dropbox
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import dropbox
          dbx = dropbox.Dropbox(
              oauth2_refresh_token=os.environ["DROPBOX_REFRESH_TOKEN"],
              app_key=os.environ["DROPBOX_APP_KEY"],
              app_secret=os.environ["DROPBOX_APP_SECRET"],
              timeout=180,
          )
          _, response = dbx.files_download("/Test/Garmin_Connect_Export_2026-11-06.zip")
          with open("Garmin_Connect_Export_2026-11-06.zip", "wb") as target:
              target.write(response.content)
          response.close()
          print("Downloaded Garmin reference ZIP")
          PY

      - name: Truncate and load three test windows into MotherDuck
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: garmin_github
          GARMIN_REQUEST_PAUSE_SECONDS: "0.3"
          GARMIN_BATCH_PAUSE_SECONDS: "5"
          GARMIN_MAX_RETRIES: "8"
          GARMIN_HISTORY_MODE: "test"
          GARMIN_TEST_MONTH_2011: "2011-12"
          GARMIN_TEST_MONTH_2022: "2022-05"
          MOTHERDUCK_BATCH_SIZE: "100"
        run: |
          python src/motherduck_export.py
          GARMIN_VALIDATION_ZIP="Garmin_Connect_Export_2026-11-06.zip" python src/garmin_zip_import.py

# [run-garmin-test] Latest test supersedes stale queued runs; validate all data fixes.
