name: Garmin Gear Diagnostic

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  diagnostic:
    if: github.event.issue.title == 'Testa skokoppling'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Garmin client
        run: python -m pip install --upgrade garmin-connect-personal-api-python dropbox

      - name: Run read-only one-month gear diagnostic
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          GARMIN_REQUEST_PAUSE_SECONDS: "0.25"
          GARMIN_BATCH_PAUSE_SECONDS: "0"
          GARMIN_MAX_RETRIES: "2"
          GEAR_TEST_MONTH: "2026-10"
        run: |
          cd src
          python gear_diagnostic.py
